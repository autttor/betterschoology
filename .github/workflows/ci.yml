name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes the standing privacy check on the committed Schoology fixtures.
      - name: Test
        run: npm test

      - name: Build Firefox extension
        run: npm run build:firefox

      # Catches manifest problems that only show up at AMO submission time.
      # Exits non-zero on errors; the two known warnings are documented in the
      # README and do not fail the build.
      - name: Lint built extension
        run: npx web-ext lint --source-dir .output/firefox-mv3 --self-hosted

      - name: Package Firefox extension
        run: npm run xpi:firefox

      - name: Upload Firefox build
        uses: actions/upload-artifact@v4
        with:
          name: better-schoology-firefox
          path: |
            .output/*.xpi
            .output/*.zip
          # WXT writes to `.output/`, a dot-directory. upload-artifact skips
          # hidden paths by default and would silently find nothing.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Local Schoology environment
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # test:e2e builds both the production and development bundles; the
      # built-bundle specs skip rather than fail when either is missing, so
      # this keeps them from silently not running.
      - name: Run browser tests
        run: npm run test:e2e
